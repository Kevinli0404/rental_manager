# 以 flutter_lints 為基礎再加嚴；選擇理由見 docs/decisions.md D-012。
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # 不允許 dynamic 隱性轉型、推論不出型別、泛型少寫型別參數。
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # 非同步：自動儲存（D-007）大量用到 Future 和 Stream，漏 await、忘了關都很難查。
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks

    # 型別：配合 strict 模式，不讓 dynamic 混進來。
    - always_declare_return_types
    - avoid_dynamic_calls

    # 錯誤處理：只丟 Exception／Error，不丟字串之類的值。
    - only_throw_errors

    # 不可變與效能。
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations

    # 一致的寫法。
    - prefer_single_quotes
    - directives_ordering

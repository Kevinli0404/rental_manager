targets:
  $default:
    builders:
      json_serializable:
        options:
          # 巢狀物件（空間、項目）也要轉成 Map，toJson 的結果才能直接比對與存檔。
          explicit_to_json: true
      drift_dev:
        options:
          # 時間存成 ISO-8601 文字：保留毫秒和時區（D-014）。
          store_date_time_values_as_text: true
          # make-migrations 用：schema 快照放 drift_schemas/，migration 測試放 test/drift/。
          databases:
            rental_manager: lib/core/database/database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
